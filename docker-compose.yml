version: '3.8'

services:
  relay:
    build:
      context: .
      dockerfile: relay/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - RELAY_PORT=3001
      - JWT_SECRET=${JWT_SECRET:-nexus-dev-secret-change-in-production}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:4173
      - LOG_LEVEL=info
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - relay
    restart: unless-stopped
